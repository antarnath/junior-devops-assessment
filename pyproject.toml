[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "N806"]
# B008: FastAPI's `Depends()` in argument defaults is the idiomatic pattern.
"app/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.black]
line-length = 100
target-version = ["py312"]
