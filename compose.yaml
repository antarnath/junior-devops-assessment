# Local deployment for the Apex Operations API.
#
#   docker compose up -d --build
#   curl http://localhost:8000/healthz
#   curl http://localhost:8000/readyz

name: apex-ops-api

services:
  db:
    image: postgres:16-alpine
    container_name: apex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-apex_operations}
    volumes:
      # Named volume so the data survives a container restart.
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apex} -d ${POSTGRES_DB:-apex_operations}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_TAG:-apex-ops-api:0.1.0}
    container_name: apex-api
    restart: unless-stopped
    depends_on:
      db:
        # Wait for the database to be healthy before starting the API.
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_USER: ${POSTGRES_USER:-apex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-local-only}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-apex_operations}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  db_data:
    driver: local
